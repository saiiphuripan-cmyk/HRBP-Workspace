<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการงาน Kanban Board (Trello Style)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Prompt for Thai -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Prompt', sans-serif;
        }
        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.3);
        }
        /* Dragging styles */
        .card-ghost {
            opacity: 0.4;
            transform: scale(0.98);
        }
        .column-drag-over {
            background-color: rgba(59, 130, 246, 0.15) !important;
            border: 2px dashed #3b82f6 !important;
        }
        .card-drop-zone {
            height: 4px;
            background-color: #3b82f6;
            margin: 4px 0;
            border-radius: 2px;
            transition: all 0.2s ease;
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 h-full flex flex-col transition-colors duration-200 select-none">

    <!-- Navbar Header -->
    <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-4 py-3 flex-none shadow-sm z-10">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
            <!-- App Logo & Title -->
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-blue-600 to-indigo-600 text-white p-2.5 rounded-xl shadow-md">
                    <i class="fa-solid fa-kanban text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 dark:from-blue-400 dark:to-indigo-400 bg-clip-text text-transparent">
                        FlowBoard Kanban
                    </h1>
                    <p class="text-xs text-gray-500 dark:text-gray-400">กระดานจัดการงานและโปรเจกต์</p>
                </div>
            </div>

            <!-- Controls (Search, Filters, Theme, Add Column) -->
            <div class="flex flex-wrap items-center gap-2">
                <!-- Search Bar -->
                <div class="relative flex-1 sm:w-64">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                    <input type="text" id="searchInput" oninput="renderBoard()" placeholder="ค้นหางาน, แท็ก..." 
                        class="w-full pl-9 pr-8 py-1.5 text-sm rounded-lg bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                    <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 text-xs">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <!-- Priority Filter Dropdown -->
                <select id="priorityFilter" onchange="renderBoard()" class="py-1.5 px-3 text-sm rounded-lg bg-gray-50 dark:bg-gray-700 border border-gray-200 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-700 dark:text-gray-200">
                    <option value="ALL">ความสำคัญทั้งหมด</option>
                    <option value="HIGH">🔴 สูง (High)</option>
                    <option value="MEDIUM">🟡 ปานกลาง (Medium)</option>
                    <option value="LOW">🟢 ต่ำ (Low)</option>
                </select>

                <!-- Add Column Button -->
                <button onclick="openAddColumnModal()" class="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition shadow-sm flex items-center gap-2">
                    <i class="fa-solid fa-plus text-xs"></i>
                    <span>เพิ่ม คอลัมน์</span>
                </button>

                <!-- Dark/Light Theme Toggle -->
                <button onclick="toggleDarkMode()" id="themeToggleBtn" class="p-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition" title="สลับโหมดสว่าง/มืด">
                    <i class="fa-solid fa-moon text-lg hidden dark:block"></i>
                    <i class="fa-solid fa-sun text-lg block dark:hidden text-amber-500"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Board Main Container (Horizontal Scrollable Column List) -->
    <main class="flex-1 overflow-x-auto p-4 md:p-6 bg-slate-100 dark:bg-gray-950">
        <div id="boardContainer" class="flex gap-4 h-full items-start min-w-max pb-4">
            <!-- Dynamic columns will be rendered here -->
        </div>
    </main>

    <!-- Card Detail / Edit Modal Dialog -->
    <div id="cardModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-200">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden transform scale-95 transition-transform duration-200" id="cardModalBox">
            
            <!-- Modal Header -->
            <div class="p-5 border-b border-gray-100 dark:border-gray-700 flex justify-between items-start bg-gray-50/50 dark:bg-gray-800/50">
                <div class="flex-1 mr-4">
                    <input type="text" id="modalTitleInput" placeholder="ชื่อการ์ดงาน..." 
                        class="w-full text-xl font-bold bg-transparent text-gray-900 dark:text-white border-b-2 border-transparent hover:border-gray-300 dark:hover:border-gray-600 focus:border-blue-500 focus:outline-none py-1 px-1 transition">
                    <div class="text-xs text-gray-400 mt-1 flex items-center gap-2">
                        <span>อยู่ในคอลัมน์:</span>
                        <span id="modalColumnName" class="font-medium text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/30 px-2 py-0.5 rounded">To Do</span>
                    </div>
                </div>
                <button onclick="closeCardModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 p-2 rounded-lg transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <!-- Modal Content (Scrollable) -->
            <div class="p-6 overflow-y-auto flex-1 space-y-6">

                <!-- Meta Controls (Priority & Due Date) -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Priority -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">
                            <i class="fa-solid fa-flag mr-1"></i> ความสำคัญ
                        </label>
                        <select id="modalPriority" class="w-full p-2.5 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="LOW">🟢 ต่ำ (Low)</option>
                            <option value="MEDIUM">🟡 ปานกลาง (Medium)</option>
                            <option value="HIGH">🔴 สูง (High)</option>
                        </select>
                    </div>

                    <!-- Due Date -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">
                            <i class="fa-regular fa-calendar-check mr-1"></i> วันกำหนดส่ง
                        </label>
                        <input type="date" id="modalDueDate" class="w-full p-2 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>

                <!-- Description -->
                <div>
                    <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">
                        <i class="fa-solid fa-align-left mr-1"></i> รายละเอียดงาน
                    </label>
                    <textarea id="modalDescription" rows="4" placeholder="เพิ่มรายละเอียด, บันทึก หรือข้อความอธิบายงานที่นี่..."
                        class="w-full p-3 text-sm rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 focus:ring-2 focus:ring-blue-500 focus:outline-none transition"></textarea>
                </div>

                <!-- Labels / Tags Section -->
                <div>
                    <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">
                        <i class="fa-solid fa-tags mr-1"></i> แท็ก / ป้ายกำกับ
                    </label>
                    <div id="modalTagsContainer" class="flex flex-wrap gap-2 mb-3">
                        <!-- Dynamic Tags rendered here -->
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="text" id="modalTagInput" placeholder="พิมพ์ชื่อแท็กใหม่..." 
                            class="flex-1 p-2 text-sm rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <input type="color" id="modalTagColor" value="#3b82f6" class="w-9 h-9 p-0.5 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 cursor-pointer">
                        <button onclick="addTagFromModal()" class="px-3 py-2 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-xs font-semibold rounded-lg transition">
                            <i class="fa-solid fa-plus mr-1"></i> เพิ่มแท็ก
                        </button>
                    </div>
                </div>

                <!-- Checklist / Subtasks Section -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">
                            <i class="fa-solid fa-list-check mr-1"></i> รายการงานย่อย (Checklist)
                        </label>
                        <span id="checklistProgressText" class="text-xs font-medium text-gray-500">0%</span>
                    </div>

                    <!-- Progress Bar -->
                    <div class="w-full h-2 bg-gray-200 dark:bg-gray-700 rounded-full mb-4 overflow-hidden">
                        <div id="checklistProgressBar" class="h-full bg-blue-500 transition-all duration-300 w-0"></div>
                    </div>

                    <!-- Checklist Items List -->
                    <div id="modalChecklistItems" class="space-y-2 mb-3">
                        <!-- Dynamic Checklist Items -->
                    </div>

                    <!-- Add Checklist Item Input -->
                    <div class="flex items-center gap-2">
                        <input type="text" id="newChecklistItemInput" placeholder="เพิ่มรายการเช็กลิสต์..." onkeypress="if(event.key==='Enter') addChecklistItemModal()"
                            class="flex-1 p-2 text-sm rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <button onclick="addChecklistItemModal()" class="px-3 py-2 bg-blue-500 text-white hover:bg-blue-600 text-xs font-semibold rounded-lg transition">
                            <i class="fa-solid fa-plus"></i> เพิ่ม
                        </button>
                    </div>
                </div>

            </div>

            <!-- Modal Footer -->
            <div class="p-4 border-t border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/80 flex justify-between items-center">
                <button onclick="deleteCurrentCardModal()" class="px-4 py-2 bg-red-100 hover:bg-red-200 dark:bg-red-900/40 dark:hover:bg-red-900/60 text-red-600 dark:text-red-400 rounded-lg text-sm font-medium transition flex items-center gap-1.5">
                    <i class="fa-solid fa-trash-can"></i>
                    <span>ลบงานนี้</span>
                </button>
                <div class="flex items-center gap-2">
                    <button onclick="closeCardModal()" class="px-4 py-2 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-lg text-sm font-medium transition">
                        ยกเลิก
                    </button>
                    <button onclick="saveCardModal()" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition shadow">
                        บันทึกการเปลี่ยนแปลง
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- Add Column Modal -->
    <div id="addColumnModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-200">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl w-full max-w-md p-6 transform scale-95 transition-transform duration-200" id="addColumnModalBox">
            <h3 class="text-lg font-bold text-gray-900 dark:text-white mb-4">เพิ่มคอลัมน์ใหม่</h3>
            <div class="mb-4">
                <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">ชื่อคอลัมน์</label>
                <input type="text" id="newColumnTitleInput" placeholder="เช่น Testing, Approved..." onkeypress="if(event.key==='Enter') saveNewColumn()"
                    class="w-full p-2.5 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
            </div>
            <div class="flex justify-end gap-2">
                <button onclick="closeAddColumnModal()" class="px-4 py-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg text-sm font-medium transition">
                    ยกเลิก
                </button>
                <button onclick="saveNewColumn()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition">
                    เพิ่มคอลัมน์
                </button>
            </div>
        </div>
    </div>

    <script>
        // Data Structure Default Fallback
        const DEFAULT_DATA = {
            columns: [
                {
                    id: 'col-1',
                    title: '📋 งานที่ต้องทำ (To Do)',
                    cards: [
                        {
                            id: 'card-1',
                            title: 'ออกแบบ UI ระบบจัดการ Kanban',
                            description: 'ออกแบบ Dashboard ให้ทันสมัย รองรับ Dark Mode และใช้งานง่ายทั้งบนคอมและมือถือ',
                            priority: 'HIGH',
                            dueDate: '2026-09-30',
                            tags: [{ name: 'Design', color: '#8b5cf6' }, { name: 'UI/UX', color: '#ec4899' }],
                            checklist: [
                                { id: 'chk-1', text: 'ร่าง Wireframe หน้าจอหลัก', completed: true },
                                { id: 'chk-2', text: 'เลือกชุดสี Palette และ Typography', completed: true },
                                { id: 'chk-3', text: 'ทำ Responsive Layout', completed: false }
                            ]
                        },
                        {
                            id: 'card-2',
                            title: 'ทำระบบ Drag and Drop',
                            description: 'เขียน HTML5 Drag & Drop API เพื่อให้ย้ายการ์ดข้ามคอลัมน์ได้อย่างลื่นไหล',
                            priority: 'MEDIUM',
                            dueDate: '2026-10-02',
                            tags: [{ name: 'Dev', color: '#3b82f6' }],
                            checklist: [
                                { id: 'chk-4', text: 'รองรับ Mouse Event', completed: true },
                                { id: 'chk-5', text: 'รองรับ Touch Event สำหรับมือถือ', completed: false }
                            ]
                        }
                    ]
                },
                {
                    id: 'col-2',
                    title: '⏳ กำลังดำเนินการ (In Progress)',
                    cards: [
                        {
                            id: 'card-3',
                            title: 'เชื่อมต่อ LocalStorage สำหรับบันทึกข้อมูล',
                            description: 'บันทึกสถานะ คอลัมน์ แท็ก และรายการเช็กลิสต์อัตโนมัติลงในเบราว์เซอร์',
                            priority: 'HIGH',
                            dueDate: '2026-09-28',
                            tags: [{ name: 'Backend', color: '#10b981' }],
                            checklist: [
                                { id: 'chk-6', text: 'เขียน Sync LocalStorage Function', completed: true }
                            ]
                        }
                    ]
                },
                {
                    id: 'col-3',
                    title: '🔍 ตรวจสอบ (Review)',
                    cards: [
                        {
                            id: 'card-4',
                            title: 'ทดสอบระบบ Filter และ Search',
                            description: 'ตรวจสอบการค้นหาจากชื่อการ์ด แท็ก และระดับความสำคัญ',
                            priority: 'LOW',
                            dueDate: '2026-09-29',
                            tags: [{ name: 'QA', color: '#f59e0b' }],
                            checklist: []
                        }
                    ]
                },
                {
                    id: 'col-4',
                    title: '✅ เสร็จสิ้น (Done)',
                    cards: [
                        {
                            id: 'card-5',
                            title: 'วางโครงสร้างโปรเจกต์ HTML + Tailwind CSS',
                            description: 'นำเข้า Font Prompt, FontAwesome และ Tailwind CDN',
                            priority: 'LOW',
                            dueDate: '2026-09-24',
                            tags: [{ name: 'Setup', color: '#64748b' }],
                            checklist: [
                                { id: 'chk-7', text: 'Setup Tailwind Configuration', completed: true }
                            ]
                        }
                    ]
                }
            ]
        };

        // App Global State Variable
        let boardState = { columns: [] };
        let activeCardId = null;
        let activeColumnId = null;
        let draggedCardId = null;
        let draggedSourceColumnId = null;

        // Initialize Application
        window.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage();
            initTheme();
            renderBoard();
        });

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('flowboard_kanban_data');
            if (saved) {
                try {
                    boardState = JSON.parse(saved);
                } catch(e) {
                    console.error("Failed to parse saved board state", e);
                    boardState = JSON.parse(JSON.stringify(DEFAULT_DATA));
                }
            } else {
                boardState = JSON.parse(JSON.stringify(DEFAULT_DATA));
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem('flowboard_kanban_data', JSON.stringify(boardState));
        }

        // Dark/Light Theme Initialization
        function initTheme() {
            const savedTheme = localStorage.getItem('flowboard_theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('flowboard_theme', isDark ? 'dark' : 'light');
        }

        function renderBoard() {
            const boardContainer = document.getElementById('boardContainer');
            boardContainer.innerHTML = '';

            const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
            const priorityFilter = document.getElementById('priorityFilter').value;
            const clearSearchBtn = document.getElementById('clearSearchBtn');

            if (searchQuery || priorityFilter !== 'ALL') {
                clearSearchBtn.classList.remove('hidden');
            } else {
                clearSearchBtn.classList.add('hidden');
            }

            boardState.columns.forEach((column) => {
                // Filter cards inside column based on search and filters
                const filteredCards = column.cards.filter(card => {
                    const matchesSearch = !searchQuery || 
                        card.title.toLowerCase().includes(searchQuery) ||
                        card.description.toLowerCase().includes(searchQuery) ||
                        card.tags.some(t => t.name.toLowerCase().includes(searchQuery));

                    const matchesPriority = priorityFilter === 'ALL' || card.priority === priorityFilter;

                    return matchesSearch && matchesPriority;
                });

                // Create Column Element
                const colEl = document.createElement('div');
                colEl.className = 'w-80 flex-none bg-gray-200/70 dark:bg-gray-800/80 rounded-2xl p-3 flex flex-col max-h-full border border-gray-200/50 dark:border-gray-700/50 shadow-sm';
                colEl.dataset.columnId = column.id;

                // Drag & Drop events for Column Dropzone
                colEl.addEventListener('dragover', (e) => handleDragOver(e, column.id));
                colEl.addEventListener('dragleave', (e) => handleDragLeave(e));
                colEl.addEventListener('drop', (e) => handleDrop(e, column.id));

                colEl.innerHTML = `
                    <!-- Column Header -->
                    <div class="flex items-center justify-between p-2 mb-2">
                        <div class="flex items-center gap-2 flex-1 mr-2">
                            <input type="text" value="${escapeHtml(column.title)}" 
                                onchange="renameColumn('${column.id}', this.value)"
                                class="font-bold text-gray-800 dark:text-gray-100 bg-transparent border-b border-transparent hover:border-gray-400 dark:hover:border-gray-500 focus:border-blue-500 focus:bg-white dark:focus:bg-gray-900 focus:outline-none rounded px-1.5 py-0.5 w-full text-sm transition">
                            <span class="text-xs bg-gray-300 dark:bg-gray-700 text-gray-600 dark:text-gray-300 font-semibold px-2 py-0.5 rounded-full">
                                ${filteredCards.length}
                            </span>
                        </div>
                        <button onclick="deleteColumn('${column.id}')" title="ลบคอลัมน์" class="text-gray-400 hover:text-red-500 dark:hover:text-red-400 p-1.5 rounded-lg hover:bg-gray-300/50 dark:hover:bg-gray-700/50 transition">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>

                    <!-- Cards Container -->
                    <div class="cards-list overflow-y-auto flex-1 space-y-3 px-0.5 py-1 min-h-[50px]" id="cards-container-${column.id}">
                        ${filteredCards.map(card => renderCardHTML(card, column.id)).join('')}
                    </div>

                    <!-- Add Card Button -->
                    <button onclick="quickAddCard('${column.id}')" class="mt-3 w-full py-2 px-3 bg-white/60 dark:bg-gray-700/50 hover:bg-white dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 rounded-xl text-xs font-semibold border border-dashed border-gray-300 dark:border-gray-600 flex items-center justify-center gap-1.5 transition">
                        <i class="fa-solid fa-plus"></i>
                        <span>เพิ่มการ์ดใหม่</span>
                    </button>
                `;

                boardContainer.appendChild(colEl);
            });
        }

        function renderCardHTML(card, columnId) {
            // Priority Tag Color mapping
            const priorityBadge = {
                HIGH: '<span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-300">🔴 สูง</span>',
                MEDIUM: '<span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300">🟡 ปานกลาง</span>',
                LOW: '<span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300">🟢 ต่ำ</span>'
            }[card.priority || 'LOW'];

            // Due Date Calculation
            let dueDateHTML = '';
            if (card.dueDate) {
                const isOverdue = new Date(card.dueDate) < new Date().setHours(0,0,0,0);
                const dateClass = isOverdue ? 'text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-950/30' : 'text-gray-500 dark:text-gray-400';
                dueDateHTML = `
                    <div class="text-[11px] ${dateClass} flex items-center gap-1 font-medium px-1.5 py-0.5 rounded">
                        <i class="fa-regular fa-clock"></i>
                        <span>${formatThaiDate(card.dueDate)}</span>
                    </div>
                `;
            }

            // Checklist Progress
            let checklistHTML = '';
            if (card.checklist && card.checklist.length > 0) {
                const doneCount = card.checklist.filter(i => i.completed).length;
                const isAllDone = doneCount === card.checklist.length;
                checklistHTML = `
                    <div class="text-[11px] ${isAllDone ? 'text-emerald-600 dark:text-emerald-400' : 'text-gray-500 dark:text-gray-400'} flex items-center gap-1 font-medium">
                        <i class="fa-solid fa-list-check"></i>
                        <span>${doneCount}/${card.checklist.length}</span>
                    </div>
                `;
            }

            // Render Tags
            const tagsHTML = (card.tags || []).map(tag => `
                <span class="text-[10px] font-semibold px-2 py-0.5 rounded-md text-white shadow-xs" style="background-color: ${tag.color || '#3b82f6'}">
                    ${escapeHtml(tag.name)}
                </span>
            `).join('');

            return `
                <div draggable="true" 
                     ondragstart="handleDragStart(event, '${card.id}', '${columnId}')"
                     ondragend="handleDragEnd(event)"
                     onclick="openCardModal('${card.id}', '${columnId}')"
                     class="bg-white dark:bg-gray-900 rounded-xl p-3.5 shadow-sm hover:shadow-md border border-gray-200/80 dark:border-gray-700/70 cursor-pointer transition transform hover:-translate-y-0.5 group">
                    
                    <!-- Tags -->
                    <div class="flex flex-wrap gap-1 mb-2">
                        ${tagsHTML}
                    </div>

                    <!-- Card Title -->
                    <h4 class="font-semibold text-sm text-gray-800 dark:text-gray-100 mb-1 line-clamp-2 leading-snug">
                        ${escapeHtml(card.title)}
                    </h4>

                    <!-- Card Description Snippet -->
                    ${card.description ? `<p class="text-xs text-gray-500 dark:text-gray-400 line-clamp-2 mb-2 font-normal">${escapeHtml(card.description)}</p>` : ''}

                    <!-- Card Metadata (Priority, Due Date, Checklist) -->
                    <div class="flex items-center justify-between pt-2 border-t border-gray-100 dark:border-gray-800/80 mt-2">
                        <div class="flex items-center gap-2">
                            ${priorityBadge}
                        </div>
                        <div class="flex items-center gap-3">
                            ${checklistHTML}
                            ${dueDateHTML}
                        </div>
                    </div>
                </div>
            `;
        }

        function handleDragStart(e, cardId, columnId) {
            draggedCardId = cardId;
            draggedSourceColumnId = columnId;
            e.target.classList.add('card-ghost');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', cardId);
        }

        function handleDragEnd(e) {
            e.target.classList.remove('card-ghost');
            document.querySelectorAll('.column-drag-over').forEach(el => el.classList.remove('column-drag-over'));
            draggedCardId = null;
            draggedSourceColumnId = null;
        }

        function handleDragOver(e, targetColumnId) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            const colEl = document.querySelector(`[data-column-id="${targetColumnId}"]`);
            if (colEl) {
                colEl.classList.add('column-drag-over');
            }
        }

        function handleDragLeave(e) {
            const colEl = e.currentTarget;
            if (colEl && !colEl.contains(e.relatedTarget)) {
                colEl.classList.remove('column-drag-over');
            }
        }

        function handleDrop(e, targetColumnId) {
            e.preventDefault();
            document.querySelectorAll('.column-drag-over').forEach(el => el.classList.remove('column-drag-over'));

            if (!draggedCardId || !draggedSourceColumnId) return;

            // Find source column and card
            const sourceCol = boardState.columns.find(c => c.id === draggedSourceColumnId);
            const targetCol = boardState.columns.find(c => c.id === targetColumnId);

            if (!sourceCol || !targetCol) return;

            const cardIndex = sourceCol.cards.findIndex(c => c.id === draggedCardId);
            if (cardIndex === -1) return;

            // Remove card from source column
            const [movedCard] = sourceCol.cards.splice(cardIndex, 1);

            // Add card to target column
            targetCol.cards.push(movedCard);

            saveToLocalStorage();
            renderBoard();
        }

        function openAddColumnModal() {
            const modal = document.getElementById('addColumnModal');
            const modalBox = document.getElementById('addColumnModalBox');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalBox.classList.remove('scale-95');
            }, 10);
            document.getElementById('newColumnTitleInput').value = '';
            document.getElementById('newColumnTitleInput').focus();
        }

        function closeAddColumnModal() {
            const modal = document.getElementById('addColumnModal');
            const modalBox = document.getElementById('addColumnModalBox');
            modal.classList.add('opacity-0');
            modalBox.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function saveNewColumn() {
            const titleInput = document.getElementById('newColumnTitleInput');
            const title = titleInput.value.trim();
            if (!title) return;

            const newCol = {
                id: 'col-' + Date.now(),
                title: title,
                cards: []
            };

            boardState.columns.push(newCol);
            saveToLocalStorage();
            renderBoard();
            closeAddColumnModal();
        }

        function renameColumn(columnId, newTitle) {
            const column = boardState.columns.find(c => c.id === columnId);
            if (column && newTitle.trim()) {
                column.title = newTitle.trim();
                saveToLocalStorage();
            }
        }

        function deleteColumn(columnId) {
            const column = boardState.columns.find(c => c.id === columnId);
            if (!column) return;

            if (column.cards.length > 0) {
                if (!confirm(`คุณแน่ใจหรือไม่ว่าต้องการลบคอลัมน์ "${column.title}" พร้อมการ์ด ${column.cards.length} รายการ?`)) {
                    return;
                }
            }

            boardState.columns = boardState.columns.filter(c => c.id !== columnId);
            saveToLocalStorage();
            renderBoard();
        }

        // Quick Add Card to Column
        function quickAddCard(columnId) {
            const title = prompt('กรอกชื่อการ์ดงานใหม่:');
            if (!title || !title.trim()) return;

            const column = boardState.columns.find(c => c.id === columnId);
            if (column) {
                const newCard = {
                    id: 'card-' + Date.now(),
                    title: title.trim(),
                    description: '',
                    priority: 'MEDIUM',
                    dueDate: '',
                    tags: [],
                    checklist: []
                };
                column.cards.push(newCard);
                saveToLocalStorage();
                renderBoard();
            }
        }

        function openCardModal(cardId, columnId) {
            activeCardId = cardId;
            activeColumnId = columnId;

            const column = boardState.columns.find(c => c.id === columnId);
            const card = column ? column.cards.find(c => c.id === cardId) : null;

            if (!card) return;

            // Populate Modal Fields
            document.getElementById('modalTitleInput').value = card.title;
            document.getElementById('modalColumnName').innerText = column.title;
            document.getElementById('modalPriority').value = card.priority || 'MEDIUM';
            document.getElementById('modalDueDate').value = card.dueDate || '';
            document.getElementById('modalDescription').value = card.description || '';

            // Render Tags in Modal
            renderModalTags(card.tags || []);

            // Render Checklist in Modal
            renderModalChecklist(card.checklist || []);

            // Show Modal with Animation
            const modal = document.getElementById('cardModal');
            const modalBox = document.getElementById('cardModalBox');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalBox.classList.remove('scale-95');
            }, 10);
        }

        function closeCardModal() {
            const modal = document.getElementById('cardModal');
            const modalBox = document.getElementById('cardModalBox');
            modal.classList.add('opacity-0');
            modalBox.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                activeCardId = null;
                activeColumnId = null;
            }, 200);
        }

        function saveCardModal() {
            if (!activeCardId || !activeColumnId) return;

            const column = boardState.columns.find(c => c.id === activeColumnId);
            const card = column ? column.cards.find(c => c.id === activeCardId) : null;

            if (!card) return;

            card.title = document.getElementById('modalTitleInput').value.trim() || 'ไม่มีชื่อการ์ด';
            card.priority = document.getElementById('modalPriority').value;
            card.dueDate = document.getElementById('modalDueDate').value;
            card.description = document.getElementById('modalDescription').value;

            saveToLocalStorage();
            renderBoard();
            closeCardModal();
        }

        function deleteCurrentCardModal() {
            if (!activeCardId || !activeColumnId) return;

            const column = boardState.columns.find(c => c.id === activeColumnId);
            if (column) {
                column.cards = column.cards.filter(c => c.id !== activeCardId);
                saveToLocalStorage();
                renderBoard();
                closeCardModal();
            }
        }

        function renderModalTags(tags) {
            const container = document.getElementById('modalTagsContainer');
            container.innerHTML = tags.map((tag, idx) => `
                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-semibold text-white shadow-xs" style="background-color: ${tag.color}">
                    <span>${escapeHtml(tag.name)}</span>
                    <button onclick="removeTagFromModal(${idx})" class="hover:text-red-200 transition">
                        <i class="fa-solid fa-xmark text-xs"></i>
                    </button>
                </span>
            `).join('');
        }

        function addTagFromModal() {
            if (!activeCardId || !activeColumnId) return;

            const nameInput = document.getElementById('modalTagInput');
            const colorInput = document.getElementById('modalTagColor');
            const tagName = nameInput.value.trim();

            if (!tagName) return;

            const column = boardState.columns.find(c => c.id === activeColumnId);
            const card = column.cards.find(c => c.id === activeCardId);

            if (!card.tags) card.tags = [];
            card.tags.push({ name: tagName, color: colorInput.value });

            nameInput.value = '';
            renderModalTags(card.tags);
        }

        function removeTagFromModal(index) {
            if (!activeCardId || !activeColumnId) return;

            const column = boardState.columns.find(c => c.id === activeColumnId);
            const card = column.cards.find(c => c.id === activeCardId);

            if (card && card.tags) {
                card.tags.splice(index, 1);
                renderModalTags(card.tags);
            }
        }

        function renderModalChecklist(checklist) {
            const container = document.getElementById('modalChecklistItems');
            const progressBar = document.getElementById('checklistProgressBar');
            const progressText = document.getElementById('checklistProgressText');

            const total = checklist.length;
            const completed = checklist.filter(i => i.completed).length;
            const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

            progressBar.style.width = `${percent}%`;
            progressText.innerText = `${percent}% (${completed}/${total})`;

            container.innerHTML = checklist.map(item => `
                <div class="flex items-center justify-between p-2 rounded-lg bg-gray-50 dark:bg-gray-900 border border-gray-100 dark:border-gray-700/60 group">
                    <label class="flex items-center gap-2.5 flex-1 cursor-pointer">
                        <input type="checkbox" ${item.completed ? 'checked' : ''} 
                            onchange="toggleChecklistItem('${item.id}')"
                            class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300 dark:border-gray-600">
                        <span class="text-sm ${item.completed ? 'line-through text-gray-400 dark:text-gray-500' : 'text-gray-700 dark:text-gray-200'} font-medium">
                            ${escapeHtml(item.text)}
                        </span>
                    </label>
                    <button onclick="removeChecklistItem('${item.id}')" class="text-gray-400 hover:text-red-500 p-1 opacity-0 group-hover:opacity-100 transition">
                        <i class="fa-solid fa-xmark text-sm"></i>
                    </button>
                </div>
            `).join('');
        }

        function addChecklistItemModal() {
            if (!activeCardId || !activeColumnId) return;

            const input = document.getElementById('newChecklistItemInput');
            const text = input.value.trim();

            if (!text) return;

            const column = boardState.columns.find(c => c.id === activeColumnId);
            const card = column.cards.find(c => c.id === activeCardId);

            if (!card.checklist) card.checklist = [];
            card.checklist.push({
                id: 'chk-' + Date.now(),
                text: text,
                completed: false
            });

            input.value = '';
            renderModalChecklist(card.checklist);
        }

        function toggleChecklistItem(itemId) {
            if (!activeCardId || !activeColumnId) return;

            const column = boardState.columns.find(c => c.id === activeColumnId);
            const card = column.cards.find(c => c.id === activeCardId);

            if (card && card.checklist) {
                const item = card.checklist.find(i => i.id === itemId);
                if (item) {
                    item.completed = !item.completed;
                    renderModalChecklist(card.checklist);
                }
            }
        }

        function removeChecklistItem(itemId) {
            if (!activeCardId || !activeColumnId) return;

            const column = boardState.columns.find(c => c.id === activeColumnId);
            const card = column.cards.find(c => c.id === activeCardId);

            if (card && card.checklist) {
                card.checklist = card.checklist.filter(i => i.id !== itemId);
                renderModalChecklist(card.checklist);
            }
        }

        // Helper Utilities
        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('priorityFilter').value = 'ALL';
            renderBoard();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function formatThaiDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            const thaiMonths = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
            const day = date.getDate();
            const month = thaiMonths[date.getMonth()];
            const year = date.getFullYear() + 543;
            return `${day} ${month} ${year.toString().slice(-2)}`;
        }
    </script>
</body>
</html>
